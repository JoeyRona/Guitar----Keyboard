<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
</head>
<body>
<h1>Guitar -- Keyboard</h1>
<button id="demo">Demo</button>
<button id="stop">Stop</button>
<label for="preset">Sound</label>
<select id=""preset">
 <option value="0">Dark Organ</option>
 <option value="1">Dark Strings</option>
 <option value="2">Jazz Organ</option>
 <option value="3">Rock Organ</option>
 <option value="4">Church Organ</option>
 <option value="5">Soft Strings</option>
</select>
<script src="app.js"></script>
<p> 
    <label for="mix">Mix</label>
    <input id="mix" type="range" min="0" max="100" step="1" value="100">
    <span id="mix-value">100%</span>
</p>
<p>
    <label for="vol">Volume</label>
    <input id="vol" type="range" min="-24" max="12" step="0.5" value="0">
    <span id="vol-value">0 dB</span>
</p>
</body>
</html>
